<head>
<script id="gpt6-luna-shim">
/* gpt-6-luna: modelo por defecto con temperatura=1 (actualización sep-2026).
   Adapta las peticiones a la API de OpenAI para la familia gpt-6:
   temperature=1, max_tokens -> max_completion_tokens (con margen para razonamiento)
   y reintento automático si la API rechaza algún parámetro. */
(function(){
  var NEW='gpt-6-luna', OLD='gpt-4o-mini';
  try{
    if(!localStorage.getItem('__gpt6_luna_mig_v1')){
      for(var i=0;i<localStorage.length;i++){
        var k=localStorage.key(i), v=localStorage.getItem(k);
        if(v===OLD||v==='"'+OLD+'"'){ localStorage.setItem(k, v.replace(OLD,NEW)); continue; }
        if(v && v.length<20000 && v.charAt(0)==='{' && v.indexOf(OLD)>=0){
          try{ var o=JSON.parse(v), ch=false;
            for(var p in o){ if(o[p]===OLD){ o[p]=NEW; ch=true; } }
            if(ch) localStorage.setItem(k, JSON.stringify(o));
          }catch(e){}
        }
      }
      localStorage.setItem('__gpt6_luna_mig_v1','1');
    }
  }catch(e){}
  var of=window.fetch; if(!of) return;
  function adapt(url,b){
    if(!b || typeof b.model!=='string' || !/^gpt-6/.test(b.model)) return false;
    b.temperature=1;
    ['top_p','frequency_penalty','presence_penalty','logit_bias','logprobs','top_logprobs'].forEach(function(p){ delete b[p]; });
    if(/chat\/completions/.test(url) && b.max_tokens!=null){
      if(b.max_completion_tokens==null) b.max_completion_tokens=Math.min(128000, (+b.max_tokens||0)+6000);
      delete b.max_tokens;
    }
    return true;
  }
  window.fetch=function(input,init){
    var url=typeof input==='string'?input:(input&&input.url)||'';
    if(!/api\.openai\.com\/v1\/(chat\/completions|responses)/.test(url) || !init || typeof init.body!=='string') return of.apply(this,arguments);
    var b; try{ b=JSON.parse(init.body); }catch(e){ return of.apply(this,arguments); }
    if(!adapt(url,b)) return of.apply(this,arguments);
    var self=this, tries=0;
    function go(){
      var ini=Object.assign({},init,{body:JSON.stringify(b)});
      return of.call(self,input,ini).then(function(r){
        if(r.status!==400 || tries>=3) return r;
        return r.clone().json().then(function(j){
          var err=(j&&j.error)||{}, p=err.param, msg=String(err.message||'');
          if(!p){ var m=msg.match(/'([a-z_]+)'/); if(m) p=m[1]; }
          if(p && b.hasOwnProperty(p) && /unsupported|not supported|does not support|only the default/i.test(msg)){
            delete b[p]; tries++; return go();
          }
          return r;
        },function(){ return r; });
      });
    }
    return go();
  };
})();
</script>

<script>
/* ═══ KERNEL ═══ */
const $=s=>document.querySelector(s);
const el=(t,c)=>{const e=document.createElement(t);if(c)e.className=c;return e;};
const APP={id:'modelosto',version:1};
const K_KEY='ia_openai_key',K_MODEL='ia_openai_model',K_STATE=APP.id+':state';
function loadCfg(){ $('#apiKey').value=localStorage.getItem(K_KEY)||''; const m=localStorage.getItem(K_MODEL); if(m)$('#model').value=m; }
function saveCfg(){ localStorage.setItem(K_KEY,$('#apiKey').value.trim()); localStorage.setItem(K_MODEL,$('#model').value); }
async function openai(messages,{json=false,temperature=0.6}={}){
  const key=$('#apiKey').value.trim(); if(!key) throw new Error('NO_KEY');
  const body={model:$('#model').value,messages,temperature}; if(json) body.response_format={type:'json_object'};
  const r=await fetch('https://api.openai.com/v1/chat/completions',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+key},body:JSON.stringify(body)});
  if(!r.ok){ const t=await r.text(); if(r.status===401) throw new Error('BAD_KEY'); throw new Error('API '+r.status+': '+t.slice(0,180)); }
  return (await r.json()).choices[0].message.content;
}
async function agente(system,user,{json=false,temperature=0.6}={}){ const out=await openai([{role:'system',content:system},{role:'user',content:String(user)}],{json,temperature}); return json?JSON.parse(out):out; }
function banner(msg,type='info'){ const b=$('#banner'); b.className='banner '+type; b.textContent=msg; b.style.display=msg?'block':'none'; }
function busy(btn,on,label){ if(on){ btn.dataset.old=btn.innerHTML; btn.disabled=true; btn.innerHTML='<span class="spin"></span> '+(label||'…'); } else { btn.disabled=false; btn.innerHTML=btn.dataset.old||btn.innerHTML; } }
function handleErr(e){ console.error(e);
  if(e.message==='NO_KEY') banner('Introduce tu OpenAI API Key en «Ajustes avanzados (API)».','err');
  else if(e.message==='BAD_KEY') banner('API Key no válida (401).','err');
  else if(e instanceof SyntaxError) banner('Formato inesperado del modelo. Reintenta.','err');
  else banner('⚠ '+e.message,'err'); }
function saveState(o){ try{ localStorage.setItem(K_STATE,JSON.stringify({v:APP.version,data:o})); }catch(e){} }
function loadState(){ try{ const s=JSON.parse(localStorage.getItem(K_STATE)); if(s&&s.v===APP.version) return s.data; localStorage.removeItem(K_STATE);}catch(e){} return null; }
async function dlWord(filename,blocks){
  const {Document,Packer,Paragraph,TextRun,HeadingLevel}=docx;
  const P=(t,o={})=>new Paragraph({children:[new TextRun({text:String(t),...o})],spacing:{after:120}}); const ch=[];
  blocks.forEach(b=>{ if(b.h1)ch.push(new Paragraph({text:b.h1,heading:HeadingLevel.HEADING_1}));
    else if(b.h2)ch.push(new Paragraph({text:b.h2,heading:HeadingLevel.HEADING_2}));
    else if(b.h3)ch.push(new Paragraph({text:b.h3,heading:HeadingLevel.HEADING_3}));
    else if(b.p!==undefined)ch.push(P(b.p,b.opts||{}));
    else if(b.bullets)b.bullets.forEach(x=>ch.push(new Paragraph({text:String(x),bullet:{level:0}})));
    else if(b.kv)b.kv.forEach(([k,v])=>ch.push(new Paragraph({children:[new TextRun({text:k+': ',bold:true}),new TextRun({text:String(v)})],spacing:{after:80}})));
    else if(b.spacer)ch.push(P('')); });
  saveAs(await Packer.toBlob(new Document({sections:[{children:ch}]})),filename.endsWith('.docx')?filename:filename+'.docx');
}
function dlPDF(filename,blocks){
  const {jsPDF}=window.jspdf; const doc=new jsPDF({unit:'pt',format:'a4'}); const W=595,M=48; let y=56; const ink=[22,41,46],petrol=[14,75,84],muted=[92,112,118];
  const line=(txt,size,style,color,gap)=>{ doc.setFont('helvetica',style||'normal'); doc.setFontSize(size||11); doc.setTextColor(...(color||ink));
    doc.splitTextToSize(String(txt),W-M*2).forEach(l=>{ if(y>800){doc.addPage();y=56;} doc.text(l,M,y); y+=(size||11)*1.35; }); if(gap)y+=gap; };
  doc.setFillColor(14,75,84); doc.rect(0,0,W,30,'F');
  blocks.forEach(b=>{ if(b.h1)line(b.h1,17,'bold',petrol,4); else if(b.h2)line(b.h2,14,'bold',petrol,3); else if(b.h3)line(b.h3,12,'bold',ink,2);
    else if(b.p!==undefined)line(b.p,11,'normal',ink,2); else if(b.bullets)b.bullets.forEach(x=>line('•  '+x,11,'normal',muted,1));
    else if(b.kv)b.kv.forEach(([k,v])=>line(k+': '+v,11,'normal',ink,1)); else if(b.spacer)y+=8; });
  doc.save(filename.endsWith('.pdf')?filename:filename+'.pdf');
}

/* ═══ APP ═══ */
const MODELS={
 "MOHO":{ds:"Modelo de la Ocupación Humana (Kielhofner)",comp:["Volición (valores, intereses, causalidad personal)","Habituación (hábitos y roles)","Capacidad de desempeño (objetiva y subjetiva/vivida)","Entorno (físico y social)"]},
 "CMOP-E":{ds:"Modelo Canadiense del Desempeño y la Implicación Ocupacional",comp:["Persona (afectivo, cognitivo, físico; espiritualidad en el núcleo)","Ocupación (autocuidado, productividad, ocio)","Entorno (físico, social, cultural, institucional)","Desempeño e implicación ocupacional"]},
 "OTPF":{ds:"Marco de Trabajo de la AOTA (dominio y proceso)",comp:["Ocupaciones (AVD, AIVD, descanso/sueño, educación, trabajo, juego, ocio, participación social)","Factores del cliente (valores/creencias, funciones y estructuras corporales)","Habilidades de desempeño (motoras, de procesamiento, de interacción social)","Patrones de desempeño (hábitos, rutinas, roles, rituales)","Contextos y entornos"]},
 "KAWA":{ds:"Modelo del río (metáfora del flujo vital)",comp:["Mizu / Agua (flujo vital, salud y bienestar)","Iwa / Rocas (problemas y circunstancias que obstruyen)","Paredes y lecho del río (entorno físico y social)","Sukima / Espacios (oportunidades donde interviene la TO)"]},
 "PEOP":{ds:"Persona–Entorno–Ocupación–(Desempeño)",comp:["Persona (capacidades y factores intrínsecos)","Entorno (factores extrínsecos)","Ocupación (actividades y tareas significativas)","Desempeño / participación ocupacional (ajuste P-E-O)"]}
};
let LAST=null; // {caso, modelo, ap, rec}

/* ── AGENTE · Generar caso ── */
async function generarCaso(){
  const area=$('#areaCaso').value;
  const sys=`Eres terapeuta ocupacional docente. Crea un caso ocupacional realista y breve del área de ${area} para trabajar modelos y marcos de referencia de TO.
Devuelve SOLO JSON: {"caso":"6-10 frases: persona (edad, situación), diagnóstico/contexto, ocupaciones significativas afectadas, desempeño, entorno físico y social, y objetivos/deseos del cliente"}`;
  const r=await agente(sys,'Genera el caso.',{json:true,temperature:0.9}); return r.caso;
}

/* ── AGENTE · Recomendar modelo ── */
async function recomendar(caso){
  const opciones=Object.keys(MODELS).map(k=>`${k}: ${MODELS[k].ds}`).join('; ');
  const sys=`Eres terapeuta ocupacional docente. Ante el caso, recomienda el modelo/marco de práctica de TO más adecuado entre: ${opciones}.
Devuelve SOLO JSON: {"recomendado":"MOHO|CMOP-E|OTPF|KAWA|PEOP","justificacion":"por qué encaja con el caso","alternativas":[{"modelo":"…","porque":"…"}]}`;
  return await agente(sys, caso, {json:true, temperature:0.4});
}

/* ── AGENTE · Aplicar modelo ── */
async function aplicarModelo(caso, modelo, compararCon){
  const M=MODELS[modelo];
  const sys=`Eres terapeuta ocupacional experto. Aplica el modelo ${modelo} (${M.ds}) al caso.
Mapea el caso sobre estos componentes EXACTOS y en este orden:
${M.comp.map((c,i)=>`${i+1}. ${c}`).join('\n')}
Devuelve SOLO JSON:
{"componentes":[{"clave":"nombre corto del componente","contenido":"qué aporta el caso sobre ese componente","alterado":true|false}],
 "perfil_ocupacional":"síntesis del perfil ocupacional del cliente",
 "objetivos":["objetivo SMART centrado en la persona","…"],
 "intervencion":["propuesta de intervención alineada con el modelo","…"],
 "marco_referencia":"marco(s) de referencia complementario(s) sugerido(s) y por qué (p. ej. biomecánico, integración sensorial, cognitivo-conductual…)",
 "justificacion":"por qué ${modelo} es adecuado para este caso"${compararCon?`,\n "diferencia_enfoque":"en qué cambia el foco respecto al modelo ${compararCon}"`:''}}
"clave" debe ser una etiqueta breve de cada componente listado, en el mismo orden. Rigor en terminología de TO.`;
  return await agente(sys, caso, {json:true, temperature:0.5});
}

/* ── Flujo ── */
async function aplicar(){
  banner(''); const caso=$('#caso').value.trim(); if(!caso){ banner('Describe el caso o genera uno de ejemplo.','info'); return; }
  const sel=$('#modelo').value; const btn=$('#aplicarBtn'); busy(btn,true,'Aplicando…');
  $('#outBody').innerHTML=''; $('#outPanel').style.display='block'; $('#outPanel').scrollIntoView({behavior:'smooth',block:'nearest'});
  try{
    let modelo=sel, rec=null;
    if(sel==='ia'){ busy(btn,true,'Recomendando…'); rec=await recomendar(caso); modelo=rec.recomendado||'MOHO'; }
    busy(btn,true,'Aplicando '+modelo+'…');
    const ap=await aplicarModelo(caso, modelo);
    LAST={caso,modelo,ap,rec,segundo:null};
    render(); saveState(LAST);
  }catch(e){ handleErr(e); } finally{ busy(btn,false); }
}

async function comparar(){
  if(!LAST){ return; } const otro=$('#cmpSel').value; if(!otro||otro===LAST.modelo){ banner('Elige un modelo distinto para comparar.','info'); return; }
  const btn=$('#cmpBtn'); busy(btn,true,'Comparando…');
  try{ const ap2=await aplicarModelo(LAST.caso, otro, LAST.modelo); LAST.segundo={modelo:otro,ap:ap2}; render(); saveState(LAST); }
  catch(e){ handleErr(e); } finally{ busy(btn,false); }
}

/* ── Render ── */
function render(){
  const b=$('#outBody'); b.innerHTML=''; const {modelo,ap,rec,segundo}=LAST;
  $('#outTitle').textContent='Modelo aplicado · '+modelo;
  if(rec){ const d=el('div','rec');
    d.innerHTML=`<h4>Recomendación de la IA</h4><div class="mod">${rec.recomendado}</div><div>${rec.justificacion||''}</div>`+
      (rec.alternativas&&rec.alternativas.length?`<div class="alt"><b>Alternativas:</b> ${rec.alternativas.map(a=>`${a.modelo} (${a.porque})`).join(' · ')}</div>`:'');
    b.appendChild(d); }
  b.appendChild(modelCard(modelo,ap));
  // comparador
  const cmp=el('div'); cmp.style.cssText='margin:8px 0 4px;display:flex;gap:8px;align-items:center;flex-wrap:wrap';
  const opts=Object.keys(MODELS).filter(k=>k!==modelo).map(k=>`<option value="${k}">${k}</option>`).join('');
  cmp.innerHTML=`<span style="font-size:13px;color:var(--muted)">Comparar con otro modelo:</span>
    <select class="inp" id="cmpSel" style="width:auto;padding:7px 10px">${opts}</select>
    <button class="btn btn-line" id="cmpBtn">Comparar</button>`;
  b.appendChild(cmp);
  if(segundo){ if(segundo.ap.diferencia_enfoque){ const df=el('div','diff'); df.innerHTML=`<b>Cambio de foco (${segundo.modelo} vs ${modelo}):</b> ${segundo.ap.diferencia_enfoque}`; b.appendChild(df); }
    b.appendChild(modelCard(segundo.modelo,segundo.ap)); }
  // export
  const tb=el('div','toolbar'); tb.innerHTML='<button class="btn btn-primary" id="dlW">⬇ Word</button><button class="btn btn-ghost" id="dlP">⬇ PDF</button>';
  b.appendChild(tb);
  $('#cmpBtn').onclick=comparar; $('#dlW').onclick=()=>dlWord('modelo_to',blocks()); $('#dlP').onclick=()=>dlPDF('modelo_to',blocks());
}
function modelCard(modelo,ap){ const M=MODELS[modelo]; const c=el('div','modelcard');
  let h=`<div class="mh"><span class="nm">${modelo}</span><span class="ds">${M.ds}</span></div>`;
  h+=`<div class="sub">Componentes del modelo aplicados al caso</div>`;
  (ap.componentes||[]).forEach(co=>{ h+=`<div class="comp ${co.alterado?'alt':''}"><span class="dot"></span><div><div class="ck">${co.clave}</div><div class="cc">${co.contenido||''}</div></div></div>`; });
  if(ap.perfil_ocupacional){ h+=`<div class="sub">Perfil ocupacional</div><p style="margin:0;font-size:14px">${ap.perfil_ocupacional}</p>`; }
  if(ap.objetivos&&ap.objetivos.length){ h+=`<div class="sub">Objetivos</div><ul>${ap.objetivos.map(x=>`<li>${x}</li>`).join('')}</ul>`; }
  if(ap.intervencion&&ap.intervencion.length){ h+=`<div class="sub">Intervención alineada con el modelo</div><ul>${ap.intervencion.map(x=>`<li>${x}</li>`).join('')}</ul>`; }
  if(ap.marco_referencia){ h+=`<div class="sub">Marco(s) de referencia</div><p style="margin:0;font-size:14px">${ap.marco_referencia}</p>`; }
  if(ap.justificacion){ h+=`<div class="just"><b>Por qué ${modelo}:</b> ${ap.justificacion}</div>`; }
  c.innerHTML=h; return c;
}

function blocks(){ const {caso,modelo,ap,segundo,rec}=LAST;
  const b=[{h1:'Aplicación de modelo de TO'},{kv:[['Modelo',modelo+' — '+MODELS[modelo].ds]]}];
  if(rec) b.push({p:'Recomendación IA: '+rec.recomendado+'. '+(rec.justificacion||'')});
  b.push({h3:'Caso'},{p:caso},{spacer:true});
  const addModel=(mo,a)=>{ b.push({h2:mo+' — '+MODELS[mo].ds});
    b.push({h3:'Componentes'}); (a.componentes||[]).forEach(co=>b.push({p:`${co.clave}${co.alterado?' (alterado)':''}: ${co.contenido||''}`}));
    if(a.perfil_ocupacional){b.push({h3:'Perfil ocupacional'});b.push({p:a.perfil_ocupacional});}
    if(a.objetivos){b.push({h3:'Objetivos'});b.push({bullets:a.objetivos});}
    if(a.intervencion){b.push({h3:'Intervención'});b.push({bullets:a.intervencion});}
    if(a.marco_referencia){b.push({h3:'Marco de referencia'});b.push({p:a.marco_referencia});}
    if(a.justificacion){b.push({h3:'Justificación'});b.push({p:a.justificacion});} b.push({spacer:true}); };
  addModel(modelo,ap);
  if(segundo){ if(segundo.ap.diferencia_enfoque)b.push({p:'Cambio de foco: '+segundo.ap.diferencia_enfoque}); addModel(segundo.modelo,segundo.ap); }
  return b;
}

/* ── Referencia lateral ── */
function renderRef(){ $('#refBox').innerHTML=Object.entries(MODELS).map(([k,v])=>`<div class="m"><b>${k}</b> — ${v.ds}</div>`).join('')
  +`<div class="m" style="margin-top:8px;font-size:11.5px">Cada modelo ofrece una lente distinta: elige según las ocupaciones afectadas, el entorno y los objetivos del cliente.</div>`; }

/* ── INIT ── */
window.addEventListener('DOMContentLoaded',()=>{
  loadCfg(); renderRef();
  $('#apiKey').addEventListener('change',saveCfg); $('#model').addEventListener('change',saveCfg);
  $('#aplicarBtn').onclick=aplicar;
  $('#genCaso').onclick=async()=>{ const b=$('#genCaso'); busy(b,true,'Generando…'); try{ $('#caso').value=await generarCaso(); }catch(e){ handleErr(e); } finally{ busy(b,false); } };
  const prev=loadState(); if(prev&&prev.ap){ LAST=prev; $('#caso').value=prev.caso||''; if(prev.modelo&&$('#modelo').querySelector(`option[value="${prev.modelo}"]`))$('#modelo').value=prev.modelo; $('#outPanel').style.display='block'; render(); }
});
</script>
</body>
